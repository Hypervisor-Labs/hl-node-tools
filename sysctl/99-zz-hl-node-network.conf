# /etc/sysctl.d/99-zz-hl-node-network.conf
#
# Kernel network tuning for a Hyperliquid node (hl-visor / hl-node) box, and for
# any box that pushes bulk data to peers over a long path.
#
# WHY THE FILENAME STARTS `99-zz`, AND WHY THAT IS NOT COSMETIC
# -------------------------------------------------------------
# systemd-sysctl reads /etc/sysctl.d/*.conf in LEXICAL order and the LAST
# assignment to a key wins. If two files set net.core.wmem_max, the one that
# sorts later is the value you end up with — and you only find out on the next
# `sysctl --system` or reboot, which may be weeks after you "applied" the tuning
# by hand. We shipped exactly that bug: a 32 MiB window in `90-…conf` that was
# silently reverted to 16 MiB by a `99-…conf` on every reboot, while the live
# runtime read 32 MiB because someone had applied it by hand afterwards. The
# tuning looked correct for weeks and was one `sysctl --system` from being wrong.
# `99-zz` sorts after essentially every distro and vendor drop-in, so this file
# wins. `verify.sh` in this directory re-checks that nothing sorts after it.
#
# KEEP ALL THESE KEYS IN ONE FILE. Splitting "the node tuning" and "the big
# window" across two files is what creates the ordering trap in the first place.
#
# Apply with ./apply.sh (idempotent, has --dry-run). Verify with ./verify.sh.

# ---------------------------------------------------------------------------
# Congestion control
# ---------------------------------------------------------------------------

# fq ("fair queue") is the packet scheduler BBR is designed to run on: BBR paces
# packets at its own estimated rate, and fq is what actually performs that
# pacing. Without fq, BBR still works but paces in software and behaves worse
# under load. Setting this costs nothing on a server NIC.
net.core.default_qdisc = fq

# BBR instead of the default `cubic`. Gossip peers are frequently 150-250 ms
# away (a lot of the network clusters in a handful of facilities, and you rarely
# get to choose your peers), and cubic collapses its window on any loss on such
# a path. BBR models the bottleneck bandwidth instead and recovers far better.
#
# CAVEAT, MEASURED — DO NOT EXPECT MIRACLES: BBR does NOT rescue a long-RTT bulk
# transfer that is bandwidth-delay-product limited. We re-measured a ~245 ms
# path with BBR + 16 MiB buffers on BOTH ends and got 7 MB/s — the same number
# the untuned path gave. If a bulk copy is slow over a long path, the fix is a
# closer source, not a different congestion control algorithm. BBR's value here
# is connection STABILITY under loss, not raw throughput at distance.
#
# 🔴 tcp_bbr is a KERNEL MODULE. If it is not loaded, this line is SILENTLY
# IGNORED and you stay on cubic with no error anywhere. apply.sh loads it and
# persists it via /etc/modules-load.d/. Always read the value back.
net.ipv4.tcp_congestion_control = bbr

# ---------------------------------------------------------------------------
# Keepalive — notice a dead peer in minutes, not hours
# ---------------------------------------------------------------------------

# Start probing an idle connection after 5 minutes instead of the kernel default
# of 7200 s (2 hours). A gossip peer that disappears without a FIN/RST (a box
# that was power-cycled, a netfilter rule that started dropping) otherwise
# occupies a peer slot for two hours while delivering nothing. The node has no
# way to tell "quiet" from "gone" on its own.
net.ipv4.tcp_keepalive_time = 300

# 30 s between probes once probing starts (default 75 s).
net.ipv4.tcp_keepalive_intvl = 30

# Give up after 5 unanswered probes. 300 + 5*30 = 450 s worst case to evict a
# dead peer, versus ~2h11m at the defaults.
net.ipv4.tcp_keepalive_probes = 5

# ---------------------------------------------------------------------------
# Socket buffer ceilings — the single highest-value setting in this file
# ---------------------------------------------------------------------------
#
# These are CEILINGS on what TCP autotuning (and an explicit setsockopt) is
# allowed to reach. They are not preallocations: a socket that never needs a big
# window never gets one, so raising the ceiling costs no memory on idle peers.
#
# Why this matters, measured. Throughput on a single TCP connection is bounded
# by  window / RTT. A default box ships with a ~208 KiB ceiling, and many ship
# with a 4 MiB tcp_wmem maximum:
#
#     4 MiB  / 0.250 s  ~=  16 MB/s
#    32 MiB  / 0.250 s  ~= 128 MB/s   (theoretical ceiling, never realised fully)
#
# We sent a ~5.2 GB bulk transfer to a peer roughly 250 ms away. Every attempt
# died at 12-14 MB/s, because the SENDING box's tcp_wmem maximum was 4 MB. After
# raising the send window to 32 MiB the same transfer completed in 93 s at a
# ~65 MB/s peak. Nothing else changed. (Bare-metal servers, desktop-class CPUs.)
#
# 🔴 The effective window is the MINIMUM of the two ends. Tuning only your side
# fixes nothing if the peer is the one that is clamped — and vice versa. A
# second operator reproduced the same fix independently on the receiving end.
#
# 🔴 We initially "ruled out buffers" by checking the RECEIVER only. The sender's
# 4 MB send window went unexamined for weeks. Check BOTH directions on BOTH ends.
#
# The value below is 32 MiB. 16 MiB (16777216) is demonstrably sufficient for a
# node that only CONSUMES gossip; 32 MiB is required on any box that ever pushes
# a multi-GB transfer to a peer more than ~100 ms away. We ship the higher number
# because it is a ceiling rather than an allocation, and because shipping one
# file is how you avoid the ordering trap described at the top.
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432

# Per-socket TCP autotuning ranges: "min default max", in bytes.
#   min     — never shrink the buffer below this, even under memory pressure.
#   default — the starting size for a new socket.
#   max     — the autotuning ceiling (additionally clamped by r/wmem_max above).
# Leave min/default near the kernel defaults: raising `default` allocates that
# much for EVERY socket on the box, which is real memory for no benefit. Only
# the maximum needs to move.
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# ---------------------------------------------------------------------------
# Queues and backlogs
# ---------------------------------------------------------------------------

# How many packets the kernel may queue on the NIC receive side when packets
# arrive faster than the CPU drains them. Block delivery is bursty — a
# multi-MiB block arrives as one wall of packets — and the default (1000 on many
# kernels) drops the tail of such a burst, which TCP then has to retransmit.
net.core.netdev_max_backlog = 5000

# The maximum ACCEPT-queue depth a listener may request. This raises the CEILING
# only.
#
# 🔴 IT DOES NOT RAISE ANY PARTICULAR LISTENER'S BACKLOG. A program gets the
# backlog it passed to listen(2), capped by this value. Several node-adjacent
# Rust servers use a standard library bind() that hardcodes a backlog of 128, and
# `ss -ltn` on such a listener still shows Send-Q 128 with somaxconn at 4096.
# Raising this number and assuming the queue got deeper is a common and
# completely invisible mistake — read `ss -ltn` and believe that instead.
# The real protection for a shallow accept queue is the connection-count ceiling
# in ../firewall/.
net.core.somaxconn = 4096

# Depth of the half-open (SYN received, not yet accepted) queue. Same character:
# a ceiling, worth raising on a box that gets connection floods.
net.ipv4.tcp_max_syn_backlog = 4096
