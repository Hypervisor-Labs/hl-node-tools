# retention.example.conf — one rule per line:  <subdirectory>  <retention-hours>
#
# Copy to /etc/hl-node-retention.conf and edit. Subdirectory names are relative
# to the node data directory (default ~/hl/data). Lines starting with # are
# comments. Minimum retention is 1 hour — the pruner refuses 0, because 0 means
# "delete the file the node is writing right now".
#
# 🔴 MEASURE BEFORE YOU CHOOSE A NUMBER. Stream sizes vary by an order of
# magnitude with market activity, and the busy hours are exactly when you have
# the least headroom. Get a real figure first:
#
#     du -sh ~/hl/data/*                        # what is actually large
#     du -sh ~/hl/data/node_order_statuses/*    # per-hour, to get GB/h
#
# We sized one stream from an estimate of 17-26 GB/h. It measured 30-41 GB/h at
# a market open, five hours of retention reached 130 GB, and the root filesystem
# hit 82%. Halving the window fixed it. Numbers below are a conservative starting
# point for a box that consumes these streams promptly, not a recommendation.
#
# Retention must outlive whatever CONSUMES the files. If you ingest each closed
# hour into a database, keep at least: one hour to close + your ingest duration +
# slack for a retried hour. Pruning a file before your own ingester reads it is
# silent data loss, not a disk saving.

# Very high volume. Keep only what you are actively reading.
node_raw_book_diffs        1

# High volume, usually consumed within the hour.
node_order_statuses        3

# Moderate volume.
node_trades                4
node_fills                 24

# Low volume, cheap to keep, valuable when reconstructing an incident.
misc_events                168
node_twap_statuses         168
